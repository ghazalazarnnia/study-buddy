<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Buddy</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="app home-page">
    <header class="home-header">
      <div class="brand">
        <span class="brand-icon" aria-hidden="true">🎓</span>
        <h1>Study Buddy</h1>
      </div>
      <button class="notification-button" type="button" aria-label="Notifications">
        <span aria-hidden="true">♧</span>
        <span class="notification-dot"></span>
      </button>
    </header>

    <section class="welcome">
      <h2>Hi there! <span aria-hidden="true">👋</span></h2>
      <p>Here’s your study overview.</p>
    </section>

    <section class="summary-grid" aria-label="Study summary">
      <article class="summary-card">
        <span class="summary-icon calendar-icon" aria-hidden="true">▣</span>
        <strong>5</strong>
        <span>Tasks</span>
      </article>
      <article class="summary-card">
        <span class="summary-icon book-icon" aria-hidden="true">▤</span>
        <strong>2</strong>
        <span>Assessments</span>
      </article>
      <article class="summary-card">
        <span class="summary-icon people-icon" aria-hidden="true">♟</span>
        <strong>3</strong>
        <span>Study Partners</span>
      </article>
    </section>

    <section class="content-section">
      <div class="section-heading">
        <h2>Upcoming Tasks</h2>
        <a href="add-task.html">View All ›</a>
      </div>

      <div class="task-list">
        <label class="task-row">
          <input type="checkbox">
          <span>
            <strong>Finish HTML assignment</strong>
            <small><span aria-hidden="true">▣</span> Due: Fri, Jan 31</small>
          </span>
        </label>
        <label class="task-row completed">
          <input type="checkbox" checked>
          <span>
            <strong>Read Chapter 3</strong>
            <small>Completed</small>
          </span>
        </label>
        <label class="task-row">
          <input type="checkbox">
          <span>
            <strong>Start project mock-up</strong>
            <small><span aria-hidden="true">▣</span> Due: Mon, Feb 3</small>
          </span>
        </label>
      </div>
    </section>

    <section class="content-section assessments-section">
      <h2>Upcoming Assessments</h2>
      <article class="assessment-card">
        <span class="assessment-icon" aria-hidden="true">▤</span>
        <strong>Web Dev Quiz</strong>
        <time datetime="2026-02-04">Tue, Feb 4</time>
      </article>
    </section>

    <a class="add-task-button" href="add-task.html">
      <span aria-hidden="true">＋</span>
      Add Task
    </a>
  </main>

  <nav class="bottom-nav" aria-label="Main navigation">
    <a class="nav-item active" href="index.html" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 10L12 3l9 7v10H3V10Z"></path>
        <path d="M9 20v-7h6v7"></path>
      </svg>
      <span>Home</span>
    </a>
    <a class="nav-item" href="add-task.html">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3" y="3" width="18" height="18" rx="4"></rect>
        <path d="M12 7v10M7 12h10"></path>
      </svg>
      <span>Add Task</span>
    </a>
    <a class="nav-item" href="study-partners.html">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="9" cy="8" r="3"></circle>
        <path d="M3 20v-2c0-3 3-5 6-5s6 2 6 5v2"></path>
        <path d="M17 6c2 1 3 3 2 5M18 14c2 1 3 3 3 5"></path>
      </svg>
      <span>Study Partners</span>
    </a>
  </nav>
</body>
</html>
