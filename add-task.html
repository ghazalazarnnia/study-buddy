
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Task | Study Buddy</title>
  <link rel="stylesheet" href="css/add-task.css">
</head>

<body>

  <div class="app">

    <header class="page-header">
      <a href="study-partners.html" class="back-button" aria-label="Back">
        &#8592;
      </a>
      <h1 class="page-title">Add Task</h1>
      <div class="header-spacer"></div>
    </header>

    <main class="main-content">

      <p class="page-description">
        Stay organized and keep track of your studies.
      </p>

      <section class="card">

        <form class="task-form">

          <div class="form-group">
            <label for="task-name">Task Name *</label>
            <input
              type="text"
              id="task-name"
              name="task-name"
              placeholder="e.g. Finish project report"
              required
            >
          </div>

          <div class="form-group">
            <label for="subject">Subject / Course</label>
            <select id="subject" name="subject">
              <option value="" selected disabled>
                Select a subject
              </option>
              <option value="web-development">
                Web Development
              </option>
              <option value="database">
                Database
              </option>
              <option value="programming">
                Programming
              </option>
              <option value="math">
                Mathematics
              </option>
              <option value="other">
                Other
              </option>
            </select>
          </div>

          <div class="form-group">
            <label for="due-date">Due Date</label>
            <input
              type="date"
              id="due-date"
              name="due-date"
            >
          </div>

          <div class="form-group">
            <label for="reminder">Reminder</label>
            <select id="reminder" name="reminder">
              <option value="none">None</option>
              <option value="1-hour">1 hour before</option>
              <option value="1-day">1 day before</option>
              <option value="2-days">2 days before</option>
              <option value="1-week">1 week before</option>
            </select>
          </div>

          <fieldset class="priority-fieldset">
            <legend>Priority</legend>

            <div class="priority-options">

              <label class="priority-option low">
                <input
                  type="radio"
                  name="priority"
                  value="low"
                >
                <span>Low</span>
              </label>

              <label class="priority-option medium">
                <input
                  type="radio"
                  name="priority"
                  value="medium"
                  checked
                >
                <span>Medium</span>
              </label>

              <label class="priority-option high">
                <input
                  type="radio"
                  name="priority"
                  value="high"
                >
                <span>High</span>
              </label>

            </div>
          </fieldset>

          <button type="button" class="primary-button">
            Save Task
          </button>

        </form>

      </section>

    </main>

  </div>

  <nav class="bottom-nav" aria-label="Main navigation">

    <a href="index.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2"
           stroke-linecap="round"
           stroke-linejoin="round"
           aria-hidden="true">
        <path d="M3 10L12 3L21 10V20H3V10Z"/>
        <path d="M9 20V13H15V20"/>
      </svg>
      <span>Home</span>
    </a>

    <a href="add-task.html"
       class="nav-item active"
       aria-current="page">
      <svg viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2"
           stroke-linecap="round"
           stroke-linejoin="round"
           aria-hidden="true">
        <rect x="3" y="3" width="18"
              height="18" rx="4"/>
        <path d="M12 7V17M7 12H17"/>
      </svg>
      <span>Tasks</span>
    </a>

    <a href="study-partners.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2"
           stroke-linecap="round"
           stroke-linejoin="round"
           aria-hidden="true">
        <circle cx="9" cy="8" r="3"/>
        <path d="M3 21V18C3 15 6 13 9 13
                 C12 13 15 15 15 18V21"/>
        <path d="M17 5C20 6 20 10 17 11"/>
        <path d="M18 14C20 15 21 17 21 20"/>
      </svg>
      <span>Study Partners</span>
    </a>

  </nav>

</body>
</html>
